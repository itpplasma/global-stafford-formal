# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Global Stafford"
  description: >-
    Lean formalization of the same-divisor identity 1 = d*R + F*d*S in the
    ring of k-linear finite-order differential operators of every smooth
    integral finitely generated algebra over a characteristic-zero field,
    extending Stafford's Conjecture 3.8 from Weyl algebras to smooth affine
    varieties. PLAN.md records the work packages and their status.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/global-stafford-formal"
  registration_status: "not-registered"
  note: >-
    Private repository, not registered with Palomar. The verification
    snapshot is recorded in docs/verification-results.json; registration
    and any visibility change are separate human decisions.

classification:
  arxiv:
    - "math.RA"
    - "math.AG"
  msc2020:
    - "16S32"
    - "14F10"

sources:
  - title: "Source-changing descent by central-parameter conjugation (private research note)"
    authors:
      - name: "Christopher Albert"
        orcid: "0000-0003-4773-416X"
    type: "original-proof"
    relationship: "other"
    note: >-
      The private paper proof formalized here. No public preprint exists.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Module structure of Weyl algebras"
    authors:
      - "J. T. Stafford"
    type: "paper"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429-442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      States the Weyl-algebra case, which is the imported theorem.

related_formalizations:
  - name: "Stafford 3.8"
    url: "https://github.com/itpplasma/stafford38-formal"
    relationship: "depends-on"

verification:
  commit: "d76051ce227f41c0fb21f114ffd61890f3b6b99b"
  report: ""
  machine_readable_report: "docs/verification-results.json"
  statement_correspondence: "docs/paper-lean-specification.md"
  allowed_axioms: ["propext", "Classical.choice", "Quot.sound"]

status:
  scope: >-
    The substantive development proves the universal same-divisor
    certificate 1 = d*R + F*d*S in the intrinsic algebra of finite-order
    differential operators of every smooth integral finitely generated
    algebra over every characteristic-zero field (GlobalStafford.universalStatement),
    and Solution.lean transports it to the Mathlib-only Challenge statement.
    Both depend only on propext, Classical.choice and Quot.sound. The
    verification record in docs/verification-results.json lists the
    independent-clone replay, the endpoint axiom audits, the Challenge and
    Solution import-closure audits, and the Comparator, NanoDa and Lean-kernel
    checks. Human expert review of the paper proof and of the statement
    correspondence is open.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "GlobalStafford.universalStatement"
      file: "GlobalStafford/Assembly/Closure.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      literature_dependencies: []
    - declaration: "GlobalStaffordChallenge.universalStatement"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Human mathematical direction, plan authorship, integration and
        release control.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "claude-sonnet-5"
      framework: "Claude Code"
      tool_setup: >-
        A controller agent maintains PLAN.md and assigns work packages;
        implementing agents write Lean under the escalation ladder recorded
        in AGENTS.md.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: >-
        Work packages are specified in PLAN.md with Lean signatures and proof
        outlines; agents commit after each green build.
  spend_usd: "not tracked"
  notes: >-
    Model use records process assistance and does not assign authorship of a
    mathematical idea.

fidelity:
  divergences: >-
    The formal proof follows the right-moved conjugation variant (paper
    Remark 4.2) and a polynomial form of the chart hypothesis; the produced
    certificate is the paper's. Smoothness is Mathlib's Algebra.Smooth.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The paper proof passed two independent-context model reviews and the
    formal development has kernel checking, scoped agent audits, and the
    statement correspondence in docs/paper-lean-specification.md. Human
    expert review of the paper and of the formal statement is open.

alignment:
  namespace: "GlobalStafford"
  statements:
    - source: "Original proof: GS-DX, Theorem 6.3"
      lean: "GlobalStafford.universalStatement"
      module: "GlobalStafford.Assembly.Closure"
      status: "proved"
      note: >-
        For every characteristic-zero field and every smooth integral
        finitely generated algebra, the literal identity 1 = d*R + F*d*S in
        the intrinsic differential-operator algebra.
    - source: "Original proof: GS-DX, Theorem 6.3 (Palomar statement)"
      lean: "GlobalStaffordChallenge.universalStatement"
      module: "Solution"
      status: "proved"
      note: >-
        Mathlib-only statement of Challenge.lean, proved in Solution.lean by
        transport; Challenge.lean keeps its one deliberate sorry.

acknowledgements: >-
  Builds on Lean, Mathlib, the AlgebraicAnalysis library and the Stafford38
  formal development. Comparator, lean4export, NanoDa and Landrun provide the
  independent submission-checking path.

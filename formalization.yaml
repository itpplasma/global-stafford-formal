# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Global Stafford"
  description: >-
    Lean formalization of the same-divisor identity 1 = d*R + F*d*S in the
    ring of k-linear finite-order differential operators of every smooth
    integral finitely generated algebra over a characteristic-zero field,
    extending Stafford's Conjecture 3.8 from Weyl algebras to smooth affine
    varieties.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/global-stafford-formal"
  registration_status: "registered"
  palomar_id: "PALOMAR-2026-09-05-000007"
  palomar_version: 2
  palomar_url: "https://palomar-registry.org/entry?id=PALOMAR-2026-09-05-000007&version=2"
  note: >-
    Public under Apache-2.0 since 2026-09-08, with explicit author authorization.
    Palomar registry record PALOMAR-2026-09-05-000007 version 2 is linked above.
    The mechanically reviewed snapshot and exact dependency pins are recorded
    in docs/verification-results.json. Zenodo integration is enabled.

classification:
  arxiv:
    - "math.RA"
    - "math.AG"
  msc2020:
    - "16S32"
    - "14F10"

sources:
  - title: "Global Stafford theorem: project proof record"
    authors:
      - name: "Christopher Albert"
        orcid: "0000-0003-4773-416X"
    type: "original-proof"
    relationship: "other"
    note: >-
      This is the project-generated proof source rather than a formalization of
      a separately published proof. The internal informal exposition preceded
      parts of the Lean implementation and records the same research development.
      The label original-proof is a source/provenance classification, not an
      absolute historical-priority certificate. A broad literature audit dated
      2026-09-09 is in docs/provenance-literature-novelty.md: no prior proof of
      the exact theorem was located and Bellamy 2026 still records a weaker
      smooth-affine D(X) two-generator problem as open, providing strong novelty
      evidence while leaving absolute priority unasserted.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Module Structure of Weyl Algebras"
    authors:
      - "J. T. Stafford"
    type: "paper"
    id: "https://doi.org/10.1112/jlms/s2-18.3.429"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429-442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      States the Weyl-algebra case, which is the imported theorem.
  - title: "The Bernstein class of modules on algebraic manifolds"
    authors:
      - "J.-E. Björk"
    type: "paper"
    location: >-
      Lecture Notes in Mathematics 867 (1981), 148-156, Problem 2.10
    relationship: "background"
    note: >-
      Source of the smooth-affine D(X) two-generator question, cited as still
      open by Bellamy 2026.
  - title: "Module Structure of Rings of Differential Operators"
    authors:
      - "S. C. Coutinho"
      - "M. P. Holland"
    type: "paper"
    id: "https://doi.org/10.1112/plms/s3-57.3.417"
    location: >-
      Proceedings of the London Mathematical Society (3) 57 (1988), 417-432
    relationship: "background"
    note: >-
      Proves that every right ideal of D(X) for a smooth irreducible affine
      characteristic-zero variety is generated by three elements.
  - title: "Module structure of Weyl algebras"
    authors:
      - "Gwyn Bellamy"
    type: "paper"
    id: "https://doi.org/10.1112/jlms.70373"
    location: >-
      Journal of the London Mathematical Society 113 (2026), e70373, Sections 3 and 6
    relationship: "background"
    note: >-
      Contemporary literature-status source: records Stafford's torsion
      cyclicity / Conjecture 3.8 frontier as open in the pre-existing
      literature and records Björk's two-generator D(X) question as open.

related_formalizations:
  - name: "Stafford 3.8"
    id: "https://doi.org/10.5281/zenodo.22667041"
    url: "https://github.com/itpplasma/stafford38-formal"
    relationship: "depends-on"
    note: >-
      The reviewed Global Stafford build consumes stafford38-formal commit
      e77e176c381ca2d6b20c030f9227f1b031415d2e. The older 784b5992 revision
      is retained in research history only as a historical inspection pin.

verification:
  commit: "b21883a5b3d8f46922713049c3b060523ea3a771"
  report: "08b8dcd152806c5033316100a624d8c61a67f9e069c18ac649f3c6612779db67"
  machine_readable_report: "docs/verification-results.json"
  statement_correspondence: "docs/paper-lean-specification.md"
  literature_review: "docs/provenance-literature-novelty.md"
  allowed_axioms: ["propext", "Classical.choice", "Quot.sound"]

status:
  scope: >-
    The universal same-divisor theorem over every smooth integral affine algebra
    in characteristic zero is proved and transported to the Mathlib-only Challenge.
    The current dependency pins passed isolated Phase I/full verification,
    endpoint and consumer audits, and Comparator with NanoDa and Lean acceptance.
    Palomar's canonical-Challenge comparison also passed locally; its outer
    systemd wrapper was unavailable in that local replay. The registry record is
    PALOMAR-2026-09-05-000007 version 2. The unique submission Challenge and
    retained legacy Challenge are byte-identical alternative templates, each
    with one deliberately compared placeholder. Mathematical proofs have no
    holes and use only the three ordinary foundations. Novelty/priority is a
    separate literature question; the 2026-09-09 audit finds strong novelty
    evidence but does not assert absolute historical priority.
  sorry_count: 2
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "GlobalStafford.universalStatement"
      file: "GlobalStafford/Assembly/Closure.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      literature_dependencies: []
    - declaration: "GlobalStaffordChallenge.universalStatement"
      file: "GlobalStaffordSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Human mathematical direction, plan authorship, integration and
        release control.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "claude-sonnet-5"
      framework: "Claude Code"
      tool_setup: >-
        A controller agent maintains PLAN.md and assigns work packages;
        implementing agents write Lean under the escalation ladder recorded
        in AGENTS.md.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: >-
        Work packages are specified in PLAN.md with Lean signatures and proof
        outlines; agents commit after each green build.
  spend_usd: "not tracked"
  notes: >-
    Model use records process assistance and does not assign authorship of a
    mathematical idea.

fidelity:
  divergences: >-
    The formal proof follows the right-moved conjugation variant (paper
    Remark 4.2) and a polynomial form of the chart hypothesis; the produced
    certificate is the paper's. Smoothness is Mathlib's Algebra.Smooth.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    Mechanical verification succeeded. The internal informal argument passed
    two independent-context model reviews and the formal development has kernel
    checking, scoped agent audits, and statement correspondence in
    docs/paper-lean-specification.md. The 2026-09-09 provenance/literature audit
    addresses the stale dependency-revision and novelty-evidence comments by
    distinguishing the consumed e77e176 Stafford38 pin from the historical
    784b5992 inspection pin and documenting the prior-art search. Human expert
    review of the paper and formal statement remains separate.

alignment:
  namespace: "GlobalStafford"
  statements:
    - source: "Project proof: GS-DX, Theorem 6.3"
      lean: "GlobalStafford.universalStatement"
      module: "GlobalStafford.Assembly.Closure"
      status: "proved"
      note: >-
        For every characteristic-zero field and every smooth integral
        finitely generated algebra, the literal identity 1 = d*R + F*d*S in
        the intrinsic differential-operator algebra.
    - source: "Project proof: GS-DX, Theorem 6.3 (Palomar statement)"
      lean: "GlobalStaffordChallenge.universalStatement"
      module: "GlobalStaffordSolution"
      status: "proved"
      note: >-
        Mathlib-only statement of GlobalStaffordChallenge.lean, proved in
        GlobalStaffordSolution.lean by transport; GlobalStaffordChallenge.lean
        keeps its one deliberate sorry.

acknowledgements: >-
  Builds on Lean, Mathlib, the AlgebraicAnalysis library and the Stafford38
  formal development. Comparator, lean4export, NanoDa and Landrun provide the
  independent submission-checking path.
